[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mechacode"
version = "0.1.0"
description = "Help to optimize the mechanism"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "DYC"},
]
dependencies = [
    "pymoo>=0.6.2",
    "numpy>=1.26.4",
    "matplotlib>=3.9.2",
    "scipy>=1.13.1",
    "plotly>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff",
    "mypy",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.distutils.egg_info]
egg_base = "."